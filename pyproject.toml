[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "authz-differ"
version = "1.0.0"
description = "Detect broken object/function-level authorization (IDOR / BOLA / missing access control) by replaying one request under multiple identities and diffing the responses."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Jakub Kozub" }]
keywords = [
    "security",
    "bug-bounty",
    "idor",
    "bola",
    "authorization",
    "access-control",
    "appsec",
    "pentest",
    "web-security",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = []

# This project depends only on the Python standard library: there are no
# runtime dependencies to install.

[project.urls]
Homepage = "https://github.com/OWNER/authz-differ"
Repository = "https://github.com/OWNER/authz-differ"
Issues = "https://github.com/OWNER/authz-differ/issues"

[project.scripts]
authz-differ = "authz_differ.cli:main"

[tool.setuptools]
packages = ["authz_differ"]
